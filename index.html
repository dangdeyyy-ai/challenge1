<!DOCTYPE html>

  <body>
    <div class="container">
      <div class="product-card">
        <div class="left-card">
          <!-- <div class="left-card-text">
            Jordan <br />
            Air
          </div> -->
          <!-- <img src="/assets/Nike-Logo-1978.png" class="nike-logo" /> -->
          <div class="back-button">
            <img src="/assets/left-arrow.png" class="arrow-icon" />
          </div>
        </div>
        <div class="right-card">
          <img src="/assets/jordan-air.png" class="jordan-air" />
          <div class="right-card-content">
            <div class="name-product">
              Jordan 1 Retro 89 <br />

              <div class="add-to-cart">Add To Cart</div>
            </div>
          </div>
        </div>
        <div class="next-button">
          <img src="/assets/right-arrow.png" class="arrow-icon" />
        </div>
      </div>
      <div class="student-card">
        <div class="banner">
          <div class="left-banner">
            <img src="/assets/iuh_logo-rut-gon-1024x577.png" class="iuh-logo" />
          </div>
          <div class="right-banner"></div>
        </div>
        <div class="profile-img">
          <img src="/assets/profile-picture.webp" class="image" />
        </div>
        <div class="profile-content">
          <div class="profile-top">
            <div class="profile-caption">thẻ sinh viên</div>

          </div>
          <div class="profile-detail">
            <div class="left-profile-detail">
              <div class="date-of-birth">NS: 18/12/2007</div>
              <div class="class">Lớp: DHTH21G_TCTA</div>
              <div class="courses">Khóa học: 2025 - 2030</div>
              <div class="city">HKTT: Tỉnh Tây Ninh</div>
            </div>
            <div class="right-profile-detail">
              <div class="MSSV">25738141</div>
              <img
                src="/assets/z7157911972050_548b1a8613f33cec10911f630cca0a93.jpg"
                class="QR"
              />
            </div>
          </div>
        </div>
